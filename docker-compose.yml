services: 
    sqlserver: 
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: uc_sqlserver
        environment:
            - ACCEPT-EULA=Y
            - MSSQL_SA_PASSWORD=Password123!
        ports:
            - "1433:1433"
        volumes:
            - sql_data:/var/opt/mssql

volumes:
    sql_data: